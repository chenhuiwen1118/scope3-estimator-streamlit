version: '3.8'

services:
  scope3-estimator:
    build:
      context: .
      dockerfile: Dockerfile
    image: scope3-estimator:0.2.0
    container_name: scope3_estimator
    ports:
      - "8501:8501"
    volumes:
      # Mount data directory for updates without rebuilding
      - ./data:/app/data:ro
      # Mount cache directory for model caching
      - ./cache:/app/cache
      # Mount logs directory
      - ./logs:/app/logs
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - scope3-network
    labels:
      - "com.scope3.estimator.version=0.2.0"
      - "com.scope3.estimator.description=Scope 3 Emission Factor Retrieval System"

  # Optional: Add nginx reverse proxy for production
  # nginx:
  #   image: nginx:alpine
  #   container_name: scope3_nginx
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./certs:/etc/nginx/certs:ro
  #   depends_on:
  #     - scope3-estimator
  #   networks:
  #     - scope3-network
  #   restart: unless-stopped

networks:
  scope3-network:
    driver: bridge

